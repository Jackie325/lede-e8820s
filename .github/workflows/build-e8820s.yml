name: Build LEDE for ZTE E8820S

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 拉取 lede 源码
        uses: actions/checkout@v4
        with:
          repository: coolsnowwolf/lede
          ref: master
          fetch-depth: 1

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd xz-utils zlib1g-dev
          df -h /

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 可选插件：把需要的行加进下面「生成配置」step 的 printf 列表即可
      #   'CONFIG_PACKAGE_luci-app-natmap=y'         全锥 NAT，P2P/游戏连接性更好
      #   'CONFIG_PACKAGE_luci-app-mosdns=y'         DNS 分流+广告过滤（与 AdGuard Home 二选一）
      #   'CONFIG_PACKAGE_luci-app-adblock=y'        轻量 DNS 广告过滤
      #   'CONFIG_PACKAGE_luci-app-eqos=y'           按 IP 限速
      #   'CONFIG_PACKAGE_luci-app-irqbalance=y'     多核软中断分担
      #   'CONFIG_PACKAGE_luci-app-netdata=y'        系统监控图表
      #   'CONFIG_PACKAGE_luci-app-filetransfer=y'   网页上传/下载文件
      #   'CONFIG_PACKAGE_luci-app-ttyd=y'           网页终端（已默认开启）
      # passwall 不在 lede 默认 feed 中，需额外添加 Openwrt-Passwall 的两个 feed
      - name: 生成配置
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_ramips=y' \
            'CONFIG_TARGET_ramips_mt7621=y' \
            'CONFIG_TARGET_ramips_mt7621_DEVICE_zte_e8820s=y' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' \
            'CONFIG_PACKAGE_luci-theme-argon=y' \
            'CONFIG_PACKAGE_luci-app-ttyd=y' \
            'CONFIG_PACKAGE_luci-app-upnp=y' \
            'CONFIG_PACKAGE_luci-app-ddns=y' \
            'CONFIG_PACKAGE_luci-app-wol=y' \
            'CONFIG_PACKAGE_luci-app-adguardhome=y' \
            'CONFIG_PACKAGE_luci-app-sqm=y' \
            'CONFIG_PACKAGE_kmod-usb2=y' \
            'CONFIG_PACKAGE_kmod-usb-storage=y' \
            'CONFIG_PACKAGE_kmod-usb-storage-extras=y' \
            'CONFIG_PACKAGE_kmod-fs-ext4=y' \
            'CONFIG_PACKAGE_kmod-fs-ntfs=y' \
            'CONFIG_PACKAGE_block-mount=y' \
            'CONFIG_PACKAGE_htop=y' \
            'CONFIG_PACKAGE_curl=y' \
            >> .config
          make defconfig

      - name: 校验设备定义
        run: |
          if ! grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_zte_e8820s=y' .config; then
            echo "::error::zte_e8820s 设备定义未生效，请检查 lede 源码是否仍包含该机型"
            grep -i 'e8820' .config || true
            exit 1
          fi
          echo "设备定义 OK"
          grep -E '^CONFIG_TARGET_(ramips|ramips_mt7621|ramips_mt7621_DEVICE)' .config

      - name: 下载源码包
        run: |
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "===== 产物 ====="
          ls -lh bin/targets/ramips/mt7621/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: lede-e8820s-${{ github.run_number }}
          path: |
            bin/targets/ramips/mt7621/*.bin
            bin/targets/ramips/mt7621/*.manifest
          if-no-files-found: error
          retention-days: 30
